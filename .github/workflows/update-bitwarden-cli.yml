name: Update Bitwarden CLI Formula

on:
  schedule:
    # Daily ~05:23 UTC (off the top of the hour to avoid scheduler congestion)
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-bitwarden-cli
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v5

      - name: Resolve latest cli-v release and rewrite formula
        env:
          # Public-repo reads; the token just raises the API rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update-bitwarden-cli.sh

      - name: Detect change
        id: diff
        run: |
          if git diff --quiet -- Formula/bitwarden-cli.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "changed=true"
              echo "version=$(grep -m1 -oE 'cli-v[0-9]+(\.[0-9]+)+' Formula/bitwarden-cli.rb | sed 's/^cli-v//')"
              echo 'digests<<EOF'
              grep -E 'url "|sha256 "' Formula/bitwarden-cli.rb | sed 's/^ *//'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify one digest end-to-end (download + hash)
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.diff.outputs.version }}
        run: |
          curl -fsSL --retry 3 -o /tmp/bw.zip \
            "https://github.com/bitwarden/clients/releases/download/cli-v${VERSION}/bw-macos-arm64-${VERSION}.zip"
          actual="$(sha256sum /tmp/bw.zip | awk '{print $1}')"
          expected="$(awk '/bw-macos-arm64-/ {f=1; next} f && /sha256/ {gsub(/.*"|".*/, ""); print; exit}' Formula/bitwarden-cli.rb)"
          [ "$actual" = "$expected" ] || { echo "digest mismatch: $actual != $expected" >&2; exit 1; }

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT (HOMEBREW_PAT) lets Formula CI auto-run on the bot PR;
          # GITHUB_TOKEN works too but its PRs do not trigger other workflows.
          token: ${{ secrets.HOMEBREW_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(bitwarden-cli): update to ${{ steps.diff.outputs.version }}"
          title: "chore(bitwarden-cli): update to ${{ steps.diff.outputs.version }}"
          branch: update-bitwarden-cli
          delete-branch: true
          body: |
            ## Automated bitwarden-cli update

            Updates the formula to **${{ steps.diff.outputs.version }}** using the
            official prebuilt binaries from
            [bitwarden/clients](https://github.com/bitwarden/clients/releases/tag/cli-v${{ steps.diff.outputs.version }}).

            SHA-256 values come from the GitHub REST API release asset metadata
            (`.assets[].digest`); the macos-arm64 digest was re-verified in this
            run by downloading the asset and hashing it.

            ```
            ${{ steps.diff.outputs.digests }}
            ```

            ---
            *Generated by `.github/workflows/update-bitwarden-cli.yml`.*
